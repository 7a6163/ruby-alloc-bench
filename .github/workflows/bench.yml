name: allocator-bench

on:
  # A README typo should not spend 20 minutes of x86 runner time rebuilding
  # three allocators from source.
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      duration:
        description: seconds per line per round
        default: "600"
      rounds:
        description: rounds per line
        default: "3"
      workload:
        description: rails or synth
        default: "rails"
  schedule:
    - cron: "0 3 * * 0"   # weekly full run

# New push supersedes the in-flight smoke run. But a dispatched or scheduled
# full run is 2.5 hours of real data -- nobody's unrelated commit gets to kill
# it, so only push/PR runs are cancellable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  bench:
    # x86_64 Debian-family, matching the production target. All five lines share
    # one runner -- a matrix would compare five different machines.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ruby-alloc-bench
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run
        env:
          # push/PR get a smoke run: enough to prove the harness and every
          # LD_PRELOAD still work. Real numbers come from dispatch/schedule.
          DURATION: ${{ inputs.duration || (github.event_name == 'schedule' && '600' || '90') }}
          ROUNDS: ${{ inputs.rounds || (github.event_name == 'schedule' && '3' || '1') }}
          WORKLOAD: ${{ inputs.workload || 'rails' }}
          COOLDOWN: 10
          CPUSET: "0-1"
          SKIP_BUILD: "1"
        run: ./bench/run.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: results/

      # Guarded: without this, a cancelled or failed bench turns into a
      # baffling "cat: No such file" that hides the actual error.
      - name: Summary
        if: always()
        run: |
          if [ -f results/REPORT.md ]; then
            cat results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No REPORT.md -- the bench step did not finish." >> "$GITHUB_STEP_SUMMARY"
          fi
